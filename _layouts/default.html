<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: "ja" }}">

  {%- include head.html -%}

  <body>

    {%- include header.html -%}

    <main class="page-content" aria-label="Content">
      <div class="wrapper">
        {{ content }}
      </div>
    </main>

    {%- include footer.html -%}

    <script>
      // 記事の見出し(h2)から「もくじ」を自動生成する
      (function () {
        var content = document.querySelector(".post-content");
        if (!content) return;
        var headings = content.querySelectorAll("h2");
        if (headings.length < 3) return;
        var toc = document.createElement("nav");
        toc.className = "toc";
        toc.setAttribute("aria-label", "もくじ");
        var title = document.createElement("p");
        title.className = "toc__title";
        title.textContent = "もくじ";
        var list = document.createElement("ol");
        headings.forEach(function (h) {
          if (!h.id) return;
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.href = "#" + h.id;
          a.textContent = h.textContent;
          li.appendChild(a);
          list.appendChild(li);
        });
        toc.appendChild(title);
        toc.appendChild(list);
        content.insertBefore(toc, headings[0]);
      })();
    </script>

    <script type="module">
      // Mermaid記法のコードブロックを図解としてレンダリングする
      const blocks = document.querySelectorAll("div.language-mermaid, pre > code.language-mermaid");
      if (blocks.length > 0) {
        const containers = [];
        blocks.forEach((el) => {
          const target = el.closest("div.language-mermaid") || el.closest("pre");
          if (!target || target.dataset.mermaidDone) return;
          target.dataset.mermaidDone = "1";
          const div = document.createElement("div");
          div.className = "mermaid";
          div.textContent = el.textContent;
          target.replaceWith(div);
          containers.push(div);
        });
        if (containers.length > 0) {
          const { default: mermaid } = await import("https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs");
          mermaid.initialize({ startOnLoad: false, theme: "neutral", fontFamily: "inherit" });
          await mermaid.run({ nodes: containers });
        }
      }
    </script>
  </body>

</html>
