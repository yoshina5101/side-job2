---
layout: default
---

<div class="home">

  <section class="site-hero">
    <h1>{{ site.title | escape }}</h1>
    <p>{{ site.description | escape }}</p>
  </section>

  {{ content }}

  {% include category-nav.html %}

  {%- if site.posts.size > 0 -%}
  <ul class="card-list">
    {%- for post in site.posts -%}
    {% include post-card.html post=post %}
    {%- endfor -%}
  </ul>
  {%- endif -%}

</div>
