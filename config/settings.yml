# ===== 記事生成の設定 =====
# このファイルを編集して保存(コミット)するだけで動作が変わります。

# 使用するClaudeモデル
#   claude-opus-4-8  : 最高品質(1記事 約15〜20円)← デフォルト
#   claude-sonnet-4-6: バランス型(1記事 約8〜10円)
#   claude-haiku-4-5 : 最安(1記事 約3円)
model: claude-opus-4-8

# 1日に投稿する記事数(毎朝の自動実行で生成される本数)
# claude-opus-4-8 の場合のAPIコスト目安:
#   1本/日: 月 約550円 | 2本/日: 月 約1,100円 | 3本/日: 月 約1,650円 | 5本/日: 月 約2,750円
posts_per_day: 3

# 週1回のAI最新ニュース解説記事
# 指定した曜日は、その日の1本目がWeb検索付きのニュース解説記事になります
# (Web検索の追加コストは1記事あたり数円程度)
news:
  enabled: true
  weekday: 0   # 0=月曜, 1=火曜, 2=水曜, 3=木曜, 4=金曜, 5=土曜, 6=日曜

# X(旧Twitter)への自動投稿
# 新記事の公開時に「フック文+リプにブログURL」を自動ツイートします。
# X APIの認証情報(GitHub Secrets)を登録したら true にしてください。
x:
  enabled: true

# 記事の方針
article:
  min_chars: 2500        # 記事の最低文字数の目安
  max_chars: 4500        # 記事の最大文字数の目安
  tone: |
    初心者にもわかりやすい、丁寧で親しみやすい「です・ます」調。
    専門用語には必ず簡単な説明を添える。
    見出し(##)を適切に使い、箇条書きや表で読みやすくする。

# トピックの自動補充
topics:
  refill_threshold: 5    # 残りトピックがこの数を下回ったら自動補充
  refill_count: 10       # 一度に補充する数

# ===== アフィリエイト設定 =====
# 各ASPに登録したら、IDを設定してください(未設定でもリンク自体は機能します)。
affiliate:
  # Amazonアソシエイトのトラッキング ID(例: yourname-22)
  amazon_tag: ""
  # もしもアフィリエイト「どこでもリンク」のURL(楽天市場用)
  # もしも管理画面 → どこでもリンク → リンク先URLに楽天の適当なページを入れて作成し、
  # 生成されたURL(href="..."の中身)をそのまま貼り付けてください。
  # 設定すると、記事内の楽天リンクが自動でもしも経由(成果計測あり)になります。
  moshimo_rakuten_link: "//af.moshimo.com/af/c/click?a_id=5632328&p_id=54&pc_id=54&pl_id=616&url=https%3A%2F%2Fwww.rakuten.co.jp%2F"
