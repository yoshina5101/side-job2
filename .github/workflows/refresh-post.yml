name: 記事の鮮度更新

# 古くなった記事を最新化し、最終更新日(last_modified_at)を付与する。
# GitHubの画面から対象記事を指定して手動実行する。
on:
  workflow_dispatch:
    inputs:
      post:
        description: "対象記事のファイル名(例: 2026-06-09-ai-chat-comparison.md)"
        required: true

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 記事を最新化
        run: python scripts/refresh_post.py --post "${{ github.event.inputs.post }}"
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 変更をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
          else
            git commit -m "記事を最新化: ${{ github.event.inputs.post }} ($(TZ=Asia/Tokyo date +'%Y-%m-%d'))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
