name: 記事の自動生成

on:
  schedule:
    # 毎朝7時(日本時間)に実行。UTCでは22時。
    - cron: "0 22 * * *"
  workflow_dispatch: # GitHubの画面から手動実行も可能

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 記事を生成
        run: python scripts/generate_post.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 記事をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts config/topics.yml
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
          else
            git commit -m "記事を自動投稿: $(date +'%Y-%m-%d')"
            git push
          fi
