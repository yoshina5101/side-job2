name: 記事の自動生成

on:
  schedule:
    # 毎朝6時37分(日本時間)に実行。UTCでは21:37。
    # 毎時0分はGitHubの予約が集中して遅延・スキップされやすいため、
    # 空いている時刻にずらしている(それでも多少の遅延はGitHubの仕様)。
    - cron: "37 21 * * *"
  workflow_dispatch: # GitHubの画面から手動実行も可能
    inputs:
      extra:
        description: "追加で生成する記事数(1日の上限を無視。通常実行は空欄のまま)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 依存パッケージをインストール
        run: pip install -r requirements.txt

      - name: 記事を生成
        run: |
          if [ -n "${{ github.event.inputs.extra }}" ]; then
            python scripts/generate_post.py --extra "${{ github.event.inputs.extra }}"
          else
            python scripts/generate_post.py
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: 記事をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _posts config/topics.yml
          if git diff --cached --quiet; then
            echo "変更がないためコミットをスキップします"
          else
            git commit -m "記事を自動投稿: $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            # 実行中にリモートが更新されていてもpushが失敗しないよう取り込む
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

      - name: Xに投稿(x.enabledがtrueのときのみ)
        run: |
          # GitHub Pagesのビルドを少し待ってからツイート(リンク先404を避ける)
          sleep 120
          python scripts/post_to_x.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}

      - name: 投稿状態をコミットしてプッシュ
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add config/x_posted.yml
          if git diff --cached --quiet; then
            echo "X投稿状態に変更なし"
          else
            git commit -m "X投稿状態を更新: $(TZ=Asia/Tokyo date +'%Y-%m-%d')"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
