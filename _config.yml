title: AIツール・ガジェットラボ
description: 最新のAIツール・ガジェットをわかりやすくレビュー・比較するブログ
lang: ja
timezone: Asia/Tokyo

# Google Search Console の所有権確認タグ
google_site_verification: "FjU4EswGh7YNHDhsCXg8xXxzVRLNOQRMhljGJ696d18"

# 公開URL(サイトマップ・canonical URL・OGPタグの生成に使われます)
# 別のドメインを使う場合は url と CNAME ファイルを書き換えてください。
url: "https://aigadget-lab.com"
baseurl: ""

theme: minima
permalink: /:year/:month/:day/:title/

# ヘッダーに表示するページ(カテゴリーページが混ざらないよう明示)
header_pages:
  - about.md
  - privacy.md
  - contact.md

# SEO関連プラグイン(GitHub Pages公式サポート)
#   jekyll-seo-tag : meta description / OGP / Twitterカード / JSON-LD構造化データを自動出力
#   jekyll-sitemap : sitemap.xml を自動生成(Google Search Console に登録する)
#   jekyll-feed    : RSSフィード(feed.xml)を自動生成
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-feed

# 全ページのデフォルトOGP画像(SNSシェア時のアイキャッチ)
defaults:
  - scope:
      path: ""
    values:
      image: /assets/images/ogp.png

# minimaテーマの設定
minima:
  date_format: "%Y年%m月%d日"

# ビルド対象から除外するファイル
exclude:
  - scripts/
  - config/
  - requirements.txt
  - README.md
  - .github/
